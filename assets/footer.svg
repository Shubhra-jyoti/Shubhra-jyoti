<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 90">
  <defs>
    <linearGradient id="footerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="50%" style="stop-color:#D4A843;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <filter id="fGlow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="90" fill="#0d1117"/>
  <rect x="0" y="0" width="800" height="1" fill="url(#footerGrad)"/>

  <!-- Pulsing center rune -->
  <text x="400" y="22" text-anchor="middle" font-size="12" fill="#D4A843" filter="url(#fGlow)" opacity="0.6">
    ✧ · ✦ · ✧
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- Quote line 1 -->
  <text x="400" y="46" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10.5" fill="#8b949e" opacity="0.6">
    "Yield the path forward to I,
  </text>
  <!-- Quote line 2 -->
  <text x="400" y="62" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10.5" fill="#8b949e" opacity="0.6">
    Shubhra Jyoti Brahma, the All-Knowing."
  </text>
  
  <text x="400" y="82" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="8" fill="#484f58" letter-spacing="3">
    ROUNDTABLE HOLD  ·  EST. 2024
  </text>
</svg>
