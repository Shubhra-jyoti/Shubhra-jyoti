<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380">
  <defs>
    <linearGradient id="barGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#B8860B"/>
      <stop offset="50%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#D4A843"/>
    </linearGradient>
    <linearGradient id="barCrimson" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B0000"/>
      <stop offset="50%" style="stop-color:#DC143C"/>
      <stop offset="100%" style="stop-color:#B22222"/>
    </linearGradient>
    <linearGradient id="barBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1B3A5C"/>
      <stop offset="50%" style="stop-color:#4682B4"/>
      <stop offset="100%" style="stop-color:#3A6B8C"/>
    </linearGradient>
    <linearGradient id="barEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1B5E20"/>
      <stop offset="50%" style="stop-color:#4CAF50"/>
      <stop offset="100%" style="stop-color:#2E7D32"/>
    </linearGradient>
    <linearGradient id="barPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4A148C"/>
      <stop offset="50%" style="stop-color:#9C27B0"/>
      <stop offset="100%" style="stop-color:#6A1B9A"/>
    </linearGradient>
    <filter id="barGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="380" rx="12" fill="#0d1117"/>
  <rect width="800" height="380" rx="12" fill="none" stroke="#D4A843" stroke-width="1" opacity="0.2"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#D4A843" letter-spacing="4" filter="url(#barGlow)">
    ⚔ INCANTATIONS MASTERED ⚔
  </text>

  <!-- React / Next.js -->
  <text x="30" y="72" font-family="'Segoe UI', sans-serif" font-size="13" fill="#c9d1d9">⚡ React / Next.js</text>
  <rect x="200" y="60" width="560" height="18" rx="9" fill="#21262d"/>
  <rect x="200" y="60" width="0" height="18" rx="9" fill="url(#barGold)" filter="url(#barGlow)">
    <animate attributeName="width" from="0" to="530" dur="2s" fill="freeze" begin="0.3s"/>
  </rect>
  <text x="740" y="73" font-family="'Segoe UI', sans-serif" font-size="11" fill="#D4A843" opacity="0">
    95%
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="2s"/>
  </text>

  <!-- Python -->
  <text x="30" y="112" font-family="'Segoe UI', sans-serif" font-size="13" fill="#c9d1d9">🐍 Python / FastAPI</text>
  <rect x="200" y="100" width="560" height="18" rx="9" fill="#21262d"/>
  <rect x="200" y="100" width="0" height="18" rx="9" fill="url(#barBlue)" filter="url(#barGlow)">
    <animate attributeName="width" from="0" to="504" dur="2s" fill="freeze" begin="0.6s"/>
  </rect>
  <text x="740" y="113" font-family="'Segoe UI', sans-serif" font-size="11" fill="#4682B4" opacity="0">
    90%
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="2.3s"/>
  </text>

  <!-- Node.js / NestJS -->
  <text x="30" y="152" font-family="'Segoe UI', sans-serif" font-size="13" fill="#c9d1d9">🛡️ Node.js / NestJS</text>
  <rect x="200" y="140" width="560" height="18" rx="9" fill="#21262d"/>
  <rect x="200" y="140" width="0" height="18" rx="9" fill="url(#barEmerald)" filter="url(#barGlow)">
    <animate attributeName="width" from="0" to="504" dur="2s" fill="freeze" begin="0.9s"/>
  </rect>
  <text x="740" y="153" font-family="'Segoe UI', sans-serif" font-size="11" fill="#4CAF50" opacity="0">
    90%
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="2.6s"/>
  </text>

  <!-- PostgreSQL / MongoDB -->
  <text x="30" y="192" font-family="'Segoe UI', sans-serif" font-size="13" fill="#c9d1d9">📜 PostgreSQL / MongoDB</text>
  <rect x="200" y="180" width="560" height="18" rx="9" fill="#21262d"/>
  <rect x="200" y="180" width="0" height="18" rx="9" fill="url(#barCrimson)" filter="url(#barGlow)">
    <animate attributeName="width" from="0" to="476" dur="2s" fill="freeze" begin="1.2s"/>
  </rect>
  <text x="740" y="193" font-family="'Segoe UI', sans-serif" font-size="11" fill="#DC143C" opacity="0">
    85%
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="2.9s"/>
  </text>

  <!-- Docker / DevOps -->
  <text x="30" y="232" font-family="'Segoe UI', sans-serif" font-size="13" fill="#c9d1d9">🔥 Docker / DevOps</text>
  <rect x="200" y="220" width="560" height="18" rx="9" fill="#21262d"/>
  <rect x="200" y="220" width="0" height="18" rx="9" fill="url(#barPurple)" filter="url(#barGlow)">
    <animate attributeName="width" from="0" to="448" dur="2s" fill="freeze" begin="1.5s"/>
  </rect>
  <text x="740" y="233" font-family="'Segoe UI', sans-serif" font-size="11" fill="#9C27B0" opacity="0">
    80%
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="3.2s"/>
  </text>

  <!-- Tailwind CSS / HTML5 / CSS3 -->
  <text x="30" y="272" font-family="'Segoe UI', sans-serif" font-size="13" fill="#c9d1d9">🎨 Tailwind / CSS3</text>
  <rect x="200" y="260" width="560" height="18" rx="9" fill="#21262d"/>
  <rect x="200" y="260" width="0" height="18" rx="9" fill="url(#barGold)" filter="url(#barGlow)">
    <animate attributeName="width" from="0" to="504" dur="2s" fill="freeze" begin="1.8s"/>
  </rect>
  <text x="740" y="273" font-family="'Segoe UI', sans-serif" font-size="11" fill="#D4A843" opacity="0">
    90%
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="3.5s"/>
  </text>

  <!-- Java / Django -->
  <text x="30" y="312" font-family="'Segoe UI', sans-serif" font-size="13" fill="#c9d1d9">☕ Java / Django</text>
  <rect x="200" y="300" width="560" height="18" rx="9" fill="#21262d"/>
  <rect x="200" y="300" width="0" height="18" rx="9" fill="url(#barBlue)" filter="url(#barGlow)">
    <animate attributeName="width" from="0" to="420" dur="2s" fill="freeze" begin="2.1s"/>
  </rect>
  <text x="740" y="313" font-family="'Segoe UI', sans-serif" font-size="11" fill="#4682B4" opacity="0">
    75%
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="3.8s"/>
  </text>

  <!-- RESTful APIs / Zod -->
  <text x="30" y="352" font-family="'Segoe UI', sans-serif" font-size="13" fill="#c9d1d9">🔮 RESTful APIs / Zod</text>
  <rect x="200" y="340" width="560" height="18" rx="9" fill="#21262d"/>
  <rect x="200" y="340" width="0" height="18" rx="9" fill="url(#barEmerald)" filter="url(#barGlow)">
    <animate attributeName="width" from="0" to="504" dur="2s" fill="freeze" begin="2.4s"/>
  </rect>
  <text x="740" y="353" font-family="'Segoe UI', sans-serif" font-size="11" fill="#4CAF50" opacity="0">
    90%
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="4.1s"/>
  </text>
</svg>
