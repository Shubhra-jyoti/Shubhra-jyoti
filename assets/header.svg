<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160">
  <defs>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B8860B"/>
      <stop offset="30%" style="stop-color:#FFD700"/>
      <stop offset="60%" style="stop-color:#D4A843"/>
      <stop offset="100%" style="stop-color:#B8860B"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="y1" values="0%;50%;0%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="subtitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B6914"/>
      <stop offset="50%" style="stop-color:#D4A843"/>
      <stop offset="100%" style="stop-color:#8B6914"/>
    </linearGradient>
    <filter id="titleGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="subGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="160" fill="#0d1117"/>

  <!-- Floating rune particles background -->
  <circle cx="100" cy="40" r="1" fill="#D4A843" opacity="0">
    <animate attributeName="opacity" values="0;0.6;0" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="50;20" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="120" r="1.5" fill="#FFD700" opacity="0">
    <animate attributeName="opacity" values="0;0.5;0" dur="3s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="cy" values="130;90" dur="3s" repeatCount="indefinite" begin="1s"/>
  </circle>
  <circle cx="600" cy="30" r="1" fill="#D4A843" opacity="0">
    <animate attributeName="opacity" values="0;0.7;0" dur="3.5s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="cy" values="40;10" dur="3.5s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <circle cx="700" cy="110" r="1.5" fill="#FFD700" opacity="0">
    <animate attributeName="opacity" values="0;0.5;0" dur="4.5s" repeatCount="indefinite" begin="2s"/>
    <animate attributeName="cy" values="120;80" dur="4.5s" repeatCount="indefinite" begin="2s"/>
  </circle>

  <!-- Small decorative runes -->
  <text x="160" y="55" font-size="8" fill="#D4A843" opacity="0.15">✦</text>
  <text x="640" y="55" font-size="8" fill="#D4A843" opacity="0.15">✦</text>
  <text x="120" y="120" font-size="6" fill="#D4A843" opacity="0.1">◆</text>
  <text x="680" y="120" font-size="6" fill="#D4A843" opacity="0.1">◆</text>

  <!-- Main title -->
  <text x="400" y="65" text-anchor="middle" font-family="'Segoe UI', 'Georgia', serif" font-size="38" font-weight="bold" fill="url(#titleGrad)" filter="url(#titleGlow)" letter-spacing="3">
    SHUBHRA JYOTI BRAHMA
    <animate attributeName="opacity" values="0;1" dur="1.5s" fill="freeze"/>
  </text>

  <!-- Subtitle -->
  <text x="400" y="95" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" fill="url(#subtitleGrad)" filter="url(#subGlow)" letter-spacing="8" opacity="0">
    T H E   A L L - K N O W I N G
    <animate attributeName="opacity" values="0;0;1" dur="2.5s" fill="freeze"/>
  </text>

  <!-- Decorative line left -->
  <line x1="140" y1="110" x2="350" y2="110" stroke="#D4A843" stroke-width="0.5" opacity="0">
    <animate attributeName="opacity" values="0;0.4" dur="3s" fill="freeze"/>
    <animate attributeName="x1" from="390" to="140" dur="2s" fill="freeze" begin="1s"/>
  </line>
  <!-- Decorative line right -->
  <line x1="450" y1="110" x2="660" y2="110" stroke="#D4A843" stroke-width="0.5" opacity="0">
    <animate attributeName="opacity" values="0;0.4" dur="3s" fill="freeze"/>
    <animate attributeName="x2" from="410" to="660" dur="2s" fill="freeze" begin="1s"/>
  </line>

  <!-- Center diamond -->
  <rect x="396" y="106" width="8" height="8" fill="#D4A843" transform="rotate(45,400,110)" opacity="0">
    <animate attributeName="opacity" values="0;0.6" dur="2s" fill="freeze" begin="1.5s"/>
  </rect>

  <!-- Bottom subtitle -->
  <text x="400" y="140" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#8b949e" letter-spacing="2" opacity="0">
    Full-Stack Developer  ·  Ahmedabad, India
    <animate attributeName="opacity" values="0;0.7" dur="2s" fill="freeze" begin="2s"/>
  </text>
</svg>
